name: iOS Build (unsigned IPA for sideloading)

on:
  workflow_dispatch:
    inputs:
      brand:
        description: 'Build flavor/brand (optional)'
        required: false
        type: string

jobs:
  build-ios:
    name: Build unsigned iOS IPA
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Check Flutter version
        run: flutter --version

      - name: Install CocoaPods
        run: |
          gem install cocoapods --no-document
          pod --version

      - name: Provision .env for build
        run: |
          if [ -n "${{ secrets.SUPABASE_URL }}" ]; then
            cat > .env <<EOF
            SUPABASE_URL=${{ secrets.SUPABASE_URL }}
            SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
            GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID }}
            GITHUB_RELEASE_REPO=${{ github.repository }}
            EOF
          else
            # Personal-use default: values from .env.example are placeholders
            # and are harmless at compile time; real values (supabase/google)
            # only affect runtime features, which are optional.
            cp .env.example .env
            sed -i "s|YOUR_GITHUB_OWNER/YOUR_GITHUB_REPO|${{ github.repository }}|" .env
          fi

      - name: Resolve Dart dependencies
        run: flutter pub get

      - name: Generate launcher icons and splash
        run: |
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create

      - name: Install pods
        working-directory: ios
        run: pod install

      - name: Build unsigned IPA
        run: |
          set -o pipefail
          flutter build ipa --no-codesign --release
          ls -la build/ios/ipa/

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: tuneload-ios-unsigned
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 7
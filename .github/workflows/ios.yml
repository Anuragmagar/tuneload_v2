name: iOS Build (unsigned IPA for sideloading)

on:
  workflow_dispatch:
    inputs:
      brand:
        description: 'Build flavor/brand (optional)'
        required: false
        type: string

jobs:
  build-ios:
    name: Build unsigned iOS IPA
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Check Flutter version
        run: flutter --version

      # Flutter 3.44 enables Swift Package Manager by default, but plugins in
      # this project (haudiotagger 1.3.5, flutter_local_notifications,
      # flutter_secure_storage) still rely on CocoaPods. Disable SPM so the
      # ios/Podfile is used instead.
      - name: Use CocoaPods (disable Swift Package Manager)
        run: flutter config --no-enable-swift-package-manager

      - name: Install CocoaPods
        run: |
          gem install cocoapods --no-document
          pod --version

      - name: Provision .env for build
        run: |
          # .env is a required build asset (listed in pubspec.yaml) but is
          # git-ignored. Values come from repo secrets when set (personal-use
          # builds: empty values are harmless at compile time).
          printf 'SUPABASE_URL=%s\nSUPABASE_ANON_KEY=%s\nGOOGLE_WEB_CLIENT_ID=%s\nGITHUB_RELEASE_REPO=%s\n' \
            "${{ secrets.SUPABASE_URL }}" \
            "${{ secrets.SUPABASE_ANON_KEY }}" \
            "${{ secrets.GOOGLE_WEB_CLIENT_ID }}" \
            "${{ github.repository }}" > .env

      - name: Resolve Dart dependencies
        run: flutter pub get

      - name: Generate launcher icons and splash
        run: |
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create

      - name: Install pods
        working-directory: ios
        run: |
          # Patch haudiotagger's podspec: its download step unzips ios.zip
          # into an extra 'haudiotagger.xcframework' folder even though the
          # zip already contains one, so the vendored-frameworks glob matches
          # it twice and CocoaPods errors with "frameworks with conflicting
          # names: haudiotagger.xcframework". Remove the '-d' target so it
          # unzips in place. A heredoc keeps the single quotes safe from shell
          # parsing that would otherwise split the -e argument.
          # The podspec path is resolved from .flutter-plugins-dependencies
          # (same source Flutter's pod helper uses), so it works regardless of
          # where the pub cache lives.
          ruby -rjson <<'RUBY'
            deps = JSON.parse(File.read("../.flutter-plugins-dependencies"))
            plugin = deps["plugins"]["ios"].find { |p| p["name"] == "haudiotagger" }
            abort "haudiotagger entry not found in .flutter-plugins-dependencies" unless plugin
            spec = File.join(plugin["path"], "ios", "haudiotagger.podspec")
            abort "podspec not found at #{spec}" unless File.exist?(spec)
            content = File.read(spec)
            patched = content.gsub(
              %q{unzip -o ios.zip -d 'haudiotagger.xcframework'},
              %q{unzip -o ios.zip}
            )
            File.write(spec, patched)
            puts "patched #{spec} (changed=#{content != patched})"
            puts content.lines.grep(/unzip/).join if content != patched
          RUBY
          pod install

      - name: Build unsigned IPA
        run: |
          set -o pipefail
          flutter build ipa --no-codesign --release || true
          # With --no-codesign, flutter skips generating the .ipa and leaves
          # the archive. Build the IPA payload manually from the archive.
          ROOT="$GITHUB_WORKSPACE"
          mkdir -p "$ROOT/build/ios/ipa/Payload"
          cp -R "$ROOT/build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app" "$ROOT/build/ios/ipa/Payload/"
          cd "$ROOT/build/ios/ipa"
          zip -r -q tuneload-unsigned.ipa Payload
          ls -la "$ROOT/build/ios/ipa/"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: tuneload-ios-unsigned
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 7